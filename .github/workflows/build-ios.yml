name: Build OpenFlux iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build iOS library
        run: |
          chmod +x build_ios.sh
          ./build_ios.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: openflux-ios-library
          path: output/ios/
